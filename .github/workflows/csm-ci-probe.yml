name: csm-ci-probe
on: workflow_dispatch
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - id: client
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CSM_CI_CLIENT_APP_ID }}
          private-key: ${{ secrets.CSM_CI_CLIENT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-issues: write
      - name: installed repositories
        env:
          CLIENT_TOKEN: ${{ steps.client.outputs.token }}
        run: |
          echo "client: $(GH_TOKEN=$CLIENT_TOKEN gh api /installation/repositories --jq '[.repositories[].name] | sort | join(",")')"
