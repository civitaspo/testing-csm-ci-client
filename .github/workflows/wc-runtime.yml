name: Issue 68 runtime

on:
  workflow_call:

permissions: {}

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bounded deterministic check
        env:
          ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          scenario=$(cat .issue68-scenario)
          case "$scenario" in
            success) ;;
            failures)
              if [ "runtime" = english ] && [ "$ATTEMPT" -lt 2 ]; then exit 1; fi
              if [ "runtime" = runtime ] && [ "$ATTEMPT" -lt 3 ]; then exit 1; fi
              ;;
            cancel)
              if [ "runtime" = english ]; then sleep 480; fi
              ;;
            *) exit 2 ;;
          esac
