name: Issue 69 protected release fixture CI
on:
  push:
    branches:
      - "e2e-issue69-status-check-bootstrap-*"
      - "release/next"
      - "e2e-issue-69-restore-*"
permissions: {}
concurrency:
  group: issue69-fixture-${{ github.ref }}
  cancel-in-progress: true
jobs:
  status-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate exact signed release fixture head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'VALIDATOR_PY'
          """Offline pure route extension. Import only from trusted workflow code."""
          import base64
          import hashlib
          import json
          import re
          
          REPOSITORY = 'civitaspo/testing-csm-ci-client'
          SERVER_ID = 347400474
          OWNER_ID = 4525500
          PATHS = ('.release-version', 'CHANGELOG.md', 'package.json', 'Cargo.toml', 'Cargo.lock', 'pyproject.toml', 'dbt_project.yml')
          RESTORE_TITLE = 'chore(e2e): restore release title acceptance fixture'
          SHA = re.compile(r'[a-f0-9]{40}\Z')
          UUID = r'[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}'
          
          
          def require(condition, message):
              if not condition:
                  raise ValueError(message)
          
          
          def blob_bytes(blob):
              if blob is None:
                  return None
              require(isinstance(blob, dict) and set(blob) == {'mode', 'blob', 'base64'}, 'malformed blob')
              require(blob['mode'] == '100644' and isinstance(blob['blob'], str) and SHA.fullmatch(blob['blob']), 'invalid blob mode or digest')
              require(isinstance(blob['base64'], str) and len(blob['base64']) <= 180_000, 'oversize blob')
              raw = base64.b64decode(blob['base64'], validate=True)
              require(len(raw) <= 128_000, 'oversize decoded blob')
              raw.decode('utf-8', errors='strict')
              require(hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == blob['blob'], 'blob digest mismatch')
              return raw
          
          
          def generated(blobs, original):
              """Intentionally supports only this fixture's exact version-line formatting."""
              raw = blobs['.release-version']
              require(raw is not None and re.fullmatch(rb'1\.1\.[1-9][0-9]{12}\n', raw), 'unexpected probe version')
              version = raw.decode().strip()
              require(blobs['CHANGELOG.md'] is not None and re.search(r'(?m)^## \[?v?' + re.escape(version) + r'\]?(?:\s|$)', blobs['CHANGELOG.md'].decode()), 'missing changelog release heading')
              for path in PATHS[2:]:
                  before, after = original[path], blobs[path]
                  require(before is not None and after is not None, 'missing fixture manifest')
                  if path == 'package.json':
                      expected, count = re.subn(rb'(?m)^(  "version": )"[^"]+"(,?)$', lambda m: m[1] + b'"' + version.encode() + b'"' + m[2], before)
                      require(count == 1, 'unsupported JSON baseline')
                  elif path == 'dbt_project.yml':
                      expected, count = re.subn(rb'(?m)^version: [^\n]+', b'version: ' + version.encode() + b' # package version', before)
                      require(count == 1, 'unsupported dbt baseline')
                  else:
                      # pyproject also contains a nested tool.fixture version, which stays fixed.
                      if path == 'pyproject.toml':
                          section = re.search(rb'(?ms)^\[project\]\n(.*?)(?=^\[|\Z)', before)
                          require(section is not None, 'unsupported project baseline')
                          changed, count = re.subn(rb'(?m)^version = "[^"]+"$', b'version = "' + version.encode() + b'"', section[1])
                          expected = before[:section.start(1)] + changed + before[section.end(1):]
                      else:
                          expected, count = re.subn(rb'(?m)^version = "[^"]+"$', b'version = "' + version.encode() + b'"', before)
                      require(count == 1, 'unsupported TOML baseline')
                  require(after == expected, f'unexpected generated {path}')
              return version
          
          
          def validate_release(context, baseline):
              require(context['repository'] == REPOSITORY and context['event'] == 'push', 'wrong repository or event')
              require(isinstance(context['head'], str) and SHA.fullmatch(context['head']) and isinstance(context['base'], str) and SHA.fullmatch(context['base']), 'invalid pinned SHA')
              require(context['head'] != context['base'], 'empty change')
              require(context['defaultHead'] == context['base'], 'default moved')
              commits = context['commits']
              require(len(commits) == 1 and commits[0]['sha'] == context['head'] and commits[0]['parent'] == context['base'], 'not one exact-head commit on current default')
              commit = commits[0]
              require(commit['verified'] is True and commit['reason'] == 'valid' and commit['githubSigned'] is True, 'invalid GitHub signature')
              require(commit['committerId'] == 19864447, 'unexpected web-flow committer')
              files = context['files']
              names = [f['filename'] for f in files]
              require(len(names) >= 1 and len(set(names)) == len(names) and set(names) <= set(PATHS), 'unexpected changed paths')
              require(all(f['status'] in ('added', 'modified', 'removed') and not f.get('previous_filename') for f in files), 'unsupported file change')
              require(set(baseline) == set(PATHS) and set(context['baseBlobs']) == set(PATHS) and set(context['headBlobs']) == set(PATHS), 'incomplete blob evidence')
              original = {p: blob_bytes(baseline[p]) for p in PATHS}
              before = {p: blob_bytes(context['baseBlobs'][p]) for p in PATHS}
              after = {p: blob_bytes(context['headBlobs'][p]) for p in PATHS}
              require(set(names) == {p for p in PATHS if before[p] != after[p]}, 'diff differs from blobs')
              for f in files:
                  p = f['filename']
                  expected = 'added' if before[p] is None else 'removed' if after[p] is None else 'modified'
                  require(f['status'] == expected, 'file status differs from blobs')
              pr = context['pr']
              require(pr['repository'] == REPOSITORY and pr['baseRef'] == 'main' and pr['baseSha'] == context['base'] and pr['headSha'] == context['head'] and pr['headRef'] == context['branch'], 'PR binding differs')
              require(pr['state'] == 'open' and pr['draft'] is False, 'PR not open and ready')
              if context['branch'] == 'release/next':
                  require(context['author'] == commit['author'] == pr['author'] == SERVER_ID, 'release not Server owned')
                  require(before == original, 'release baseline drift')
                  version = generated(after, original)
                  title = f'chore(release): v{version}'
                  require(pr['title'] == title and commit['subject'] == title, 'release semantic subject differs')
                  run = context['preparationRun']
                  require(type(run['id']) is int and run['id'] > 0 and pr['body'].count('<!-- csm-ci:securefix:') == 1 and f"<!-- csm-ci:securefix:{run['id']} -->" in pr['body'], 'preparation marker differs')
                  require(run['repository'] == REPOSITORY and run['head'] == context['base'] and run['event'] == 'workflow_dispatch' and run['workflow'] == '.github/workflows/csm-ci-release-pr.yml' and run['conclusion'] == 'success', 'preparation run differs')
                  require(run['candidate'] == '31421b13a3db5e0a3e4f49cee7f4791acd8442f0', 'preparation candidate differs')
                  return 'release'
              require(re.fullmatch('e2e-issue-69-restore-' + UUID, context['branch']), 'unrecognized release route')
              require(context['author'] == commit['author'] == pr['author'] == OWNER_ID, 'restore not operator owned')
              require(pr['title'] == commit['subject'] == RESTORE_TITLE, 'restore subject differs')
              correlation = context['branch'].removeprefix('e2e-issue-69-restore-')
              require(pr['body'] == f'Issue 69 probe {correlation}. Restore only the snapshotted release files.', 'restore correlation differs')
              generated(before, original)
              require(after == original, 'restore differs from immutable baseline')
              return 'release-restoration'
          
          # Concatenated after release_route.py inside the native read-only push workflow.
          import os
          import hashlib
          import json
          import re
          import time
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          
          WORKFLOW = '.github/workflows/e2e-issue69-status-check.yml'
          MANIFEST = 'e2e/issue69-status-check-baseline.json'
          PRESERVED = ('.github/workflows/e2e-issue67-status-check.yml', 'e2e/issue67-status-check-baseline.json')
          CANDIDATE = '31421b13a3db5e0a3e4f49cee7f4791acd8442f0'
          
          
          def manifest_data(blob):
              raw = blob_bytes(blob)
              require(raw is not None, 'missing trusted manifest')
              value = json.loads(raw)
              require(set(value) == {'schema', 'repository', 'session', 'originalDefault', 'candidate', 'original', 'preserved', 'workflowSha256'}, 'unexpected manifest schema')
              require(value['schema'] == 1 and value['repository'] == REPOSITORY and value['candidate'] == CANDIDATE, 'manifest identity differs')
              require(isinstance(value['session'], str) and re.fullmatch(r'[a-f0-9]{12}', value['session']), 'invalid manifest session')
              require(isinstance(value['originalDefault'], str) and SHA.fullmatch(value['originalDefault']), 'invalid manifest default')
              require(set(value['original']) == set(PATHS) and set(value['preserved']) == set(PRESERVED), 'manifest baseline incomplete')
              for obj in [*value['original'].values(), *value['preserved'].values()]:
                  blob_bytes(obj)
              require(all(value['preserved'][p] is not None for p in PRESERVED), 'missing Issue 67 fixture')
              require(isinstance(value['workflowSha256'], str) and re.fullmatch(r'[a-f0-9]{64}', value['workflowSha256']), 'invalid workflow digest')
              return value
          
          
          def validate_bootstrap(context, manifest, workflow, manifest_blob):
              require(context['branch'] == 'e2e-issue69-status-check-bootstrap-' + manifest['session'], 'bootstrap branch differs')
              require(context['base'] == manifest['originalDefault'] and context['defaultHead'] == context['base'], 'bootstrap default moved')
              require(context['author'] == OWNER_ID, 'bootstrap sender is not operator')
              commits = context['commits']
              require(len(commits) == 1 and commits[0]['sha'] == context['head'] and commits[0]['parent'] == context['base'], 'bootstrap commit binding differs')
              commit = commits[0]
              require(commit['author'] == OWNER_ID and commit['committerId'] == 19864447, 'bootstrap author or committer differs')
              require(commit['verified'] is True and commit['reason'] == 'valid' and commit['githubSigned'] is True, 'bootstrap signature invalid')
              require(commit['subject'] == 'test(ci): validate protected release fixture heads', 'bootstrap subject differs')
              files = context['files']
              require(len(files) == 2 and {f['filename'] for f in files} == {WORKFLOW, MANIFEST}, 'bootstrap changed paths differ')
              require(all(f['status'] == 'added' and not f.get('previous_filename') for f in files), 'bootstrap requires new regular files')
              require(context['baseBlobs'][WORKFLOW] is None and context['baseBlobs'][MANIFEST] is None, 'bootstrap destination exists')
              require(context['headBlobs'][WORKFLOW] == workflow and context['headBlobs'][MANIFEST] == manifest_blob, 'bootstrap fixture bytes differ')
              for path in PATHS:
                  require(context['baseBlobs'][path] == manifest['original'][path] and context['headBlobs'][path] == manifest['original'][path], 'bootstrap changed generated baseline')
              return 'release-bootstrap'
          
          
          class API:
              def __init__(self):
                  self.deadline = time.monotonic() + 260
                  self.cache = {}
          
              def request(self, path, query=None):
                  require(path.startswith('/repos/' + REPOSITORY + '/') or path == '/graphql' and query is not None, 'endpoint escaped testing repository')
                  for attempt in range(3):
                      remaining = self.deadline - time.monotonic()
                      require(remaining > 0, 'validator deadline exceeded')
                      data = None if query is None else json.dumps(query).encode()
                      request = urllib.request.Request('https://api.github.com' + path, data=data, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
                      try:
                          with urllib.request.urlopen(request, timeout=min(15, remaining)) as response:
                              raw = response.read(2_000_001)
                              require(len(raw) <= 2_000_000, 'oversize API response')
                              return json.loads(raw)
                      except urllib.error.HTTPError as error:
                          if error.code in (429, 500, 502, 503, 504) and attempt < 2:
                              time.sleep(1)
                              continue
                          raise ValueError(f'GitHub read failed ({error.code})') from None
                  raise ValueError('read retries exhausted')
          
              def immutable(self, path):
                  if path not in self.cache:
                      self.cache[path] = self.request(path)
                  return self.cache[path]
          
              def read_blob(self, commit, path):
                  tree = self.immutable(f'/repos/{REPOSITORY}/git/commits/{commit}')['tree']['sha']
                  parts = path.split('/')
                  for i, part in enumerate(parts):
                      data = self.immutable(f'/repos/{REPOSITORY}/git/trees/{tree}')
                      require(data.get('truncated') is False, 'truncated Git tree')
                      entries = [x for x in data['tree'] if x['path'] == part]
                      if not entries:
                          return None
                      require(len(entries) == 1, 'duplicate Git tree entry')
                      entry = entries[0]
                      if i < len(parts) - 1:
                          require(entry['type'] == 'tree' and entry['mode'] == '040000', 'invalid path ancestor')
                          tree = entry['sha']
                      else:
                          require(entry['type'] == 'blob' and entry['mode'] == '100644', 'invalid Git file mode')
                          data = self.immutable(f'/repos/{REPOSITORY}/git/blobs/{entry["sha"]}')
                          require(data['encoding'] == 'base64' and data['size'] <= 128_000, 'invalid Git blob encoding or size')
                          result = {'mode': entry['mode'], 'blob': entry['sha'], 'base64': ''.join(data['content'].splitlines())}
                          blob_bytes(result)
                          return result
          
              def small(self, path):
                  data = self.request(path + ('&' if '?' in path else '?') + 'per_page=100')
                  require(isinstance(data, list) and len(data) < 100, 'incomplete bounded API listing')
                  return data
          
              def wait(self, description, read):
                  until = min(self.deadline, time.monotonic() + 110)
                  while time.monotonic() < until:
                      result = read()
                      if result is not None:
                          return result
                      time.sleep(2)
                  raise ValueError('deadline waiting for ' + description)
          
          
          def load_pr(api, branch, head, base):
              encoded = urllib.parse.quote('civitaspo:' + branch, safe='')
              pulls = api.small(f'/repos/{REPOSITORY}/pulls?state=open&head={encoded}&base=main')
              require(len(pulls) <= 1, 'multiple matching release PRs')
              if not pulls:
                  return None
              pr = api.request(f'/repos/{REPOSITORY}/pulls/{pulls[0]["number"]}')
              require(pr['head']['repo']['full_name'] == REPOSITORY and pr['base']['repo']['full_name'] == REPOSITORY, 'fork PR rejected')
              require(pr['head']['sha'] == head and pr['base']['sha'] == base, 'PR moved during discovery')
              return {'number': pr['number'], 'repository': pr['head']['repo']['full_name'], 'baseRef': pr['base']['ref'], 'baseSha': pr['base']['sha'], 'headSha': pr['head']['sha'], 'headRef': pr['head']['ref'], 'state': pr['state'], 'draft': pr['draft'], 'author': pr['user']['id'], 'title': pr['title'], 'body': pr['body'] or ''}
          
          
          def preparation(api, pr, base):
              markers = re.findall(r'<!-- csm-ci:securefix:([1-9][0-9]*) -->', pr['body'])
              require(len(markers) == 1 and pr['body'].count('<!-- csm-ci:securefix:') == 1, 'ambiguous preparation marker')
              run = api.request(f'/repos/{REPOSITORY}/actions/runs/{markers[0]}')
              require(run['id'] == int(markers[0]), 'preparation ID differs')
              if run['status'] != 'completed':
                  return None
              references = [w for w in run.get('referenced_workflows', []) if w['path'].split('@')[0] == REPOSITORY.replace('testing-csm-ci-client', 'csm-ci-actions') + '/.github/workflows/client-release-prepare.yml']
              require(len(references) == 1, 'preparation reusable workflow evidence missing')
              return {'id': run['id'], 'repository': run['repository']['full_name'], 'head': run['head_sha'], 'event': run['event'], 'workflow': run['path'].split('@')[0], 'conclusion': run['conclusion'], 'candidate': references[0]['sha']}
          
          
          def live(api=None, event=None, env=None):
              api = api or API()
              env = os.environ if env is None else env
              if event is None:
                  with open(env['GITHUB_EVENT_PATH'], encoding='utf-8') as handle:
                      event = json.load(handle)
              require(env['GITHUB_REPOSITORY'] == REPOSITORY and event['repository']['full_name'] == REPOSITORY, 'wrong execution repository')
              require(env['GITHUB_EVENT_NAME'] == 'push', 'native push required')
              head = env['GITHUB_SHA']
              require(isinstance(head, str) and SHA.fullmatch(head) and event['after'] == head and event.get('deleted') is False, 'invalid pushed head')
              require(event['ref'].startswith('refs/heads/'), 'branch push required')
              branch = event['ref'].removeprefix('refs/heads/')
              bootstrap = re.fullmatch(r'e2e-issue69-status-check-bootstrap-[a-f0-9]{12}', branch) is not None
              require(bootstrap or branch == 'release/next' or re.fullmatch('e2e-issue-69-restore-' + UUID, branch), 'unsupported push branch')
              commit = api.request(f'/repos/{REPOSITORY}/commits/{head}')
              require(commit['sha'] == head and len(commit['parents']) == 1, 'proposed commit identity or parent differs')
              base = commit['parents'][0]['sha']
              require(isinstance(base, str) and SHA.fullmatch(base), 'invalid parent SHA')
              def stable():
                  require(api.request(f'/repos/{REPOSITORY}/git/ref/heads/main')['object']['sha'] == base, 'default moved during validation')
                  ref = urllib.parse.quote(branch, safe='/')
                  require(api.request(f'/repos/{REPOSITORY}/git/ref/heads/{ref}')['object']['sha'] == head, 'branch moved during validation')
              stable()
              compare = api.request(f'/repos/{REPOSITORY}/compare/{base}...{head}')
              require(compare['status'] == 'ahead' and compare['ahead_by'] == compare['total_commits'] == 1 and compare['behind_by'] == 0, 'incomplete compare history')
              require(compare['merge_base_commit']['sha'] == base and len(compare['commits']) == 1 and compare['commits'][0]['sha'] == head, 'compare commit evidence differs')
              require(len(compare['files']) <= 7 and all(f.get('status') != 'renamed' for f in compare['files']), 'compare paths incomplete or renamed')
              signature = api.request('/graphql', {'query': 'query($oid:GitObjectID!){repository(owner:"civitaspo",name:"testing-csm-ci-client"){object(oid:$oid){... on Commit{oid signature{isValid wasSignedByGitHub}}}}}', 'variables': {'oid': head}})
              require(not signature.get('errors'), 'GraphQL signature read failed')
              signed = signature['data']['repository']['object']
              require(signed['oid'] == head, 'GraphQL commit differs')
              trust_ref = head if bootstrap else base
              trusted_workflow = api.read_blob(trust_ref, WORKFLOW)
              trusted_manifest = api.read_blob(trust_ref, MANIFEST)
              manifest = manifest_data(trusted_manifest)
              raw_workflow = blob_bytes(trusted_workflow)
              require(raw_workflow is not None and hashlib.sha256(raw_workflow).hexdigest() == manifest['workflowSha256'], 'installed workflow digest differs')
              for path in PRESERVED:
                  require(api.read_blob(base, path) == manifest['preserved'][path] and api.read_blob(head, path) == manifest['preserved'][path], 'Issue 67 fixture changed')
              context = {'repository': REPOSITORY, 'event': 'push', 'head': head, 'base': base, 'defaultHead': base, 'branch': branch, 'author': event['sender']['id'], 'commits': [{'sha': head, 'parent': base, 'author': (commit.get('author') or {}).get('id'), 'committerId': (commit.get('committer') or {}).get('id'), 'verified': commit['commit']['verification']['verified'], 'reason': commit['commit']['verification']['reason'], 'githubSigned': signed.get('signature') is not None and signed['signature']['isValid'] is True and signed['signature']['wasSignedByGitHub'] is True, 'subject': commit['commit']['message'].split('\n')[0]}], 'files': compare['files'], 'baseBlobs': {p: api.read_blob(base, p) for p in PATHS}, 'headBlobs': {p: api.read_blob(head, p) for p in PATHS}}
              if bootstrap:
                  for path in (WORKFLOW, MANIFEST):
                      context['baseBlobs'][path] = api.read_blob(base, path)
                      context['headBlobs'][path] = api.read_blob(head, path)
                  result = validate_bootstrap(context, manifest, trusted_workflow, trusted_manifest)
              else:
                  for path, expected in ((WORKFLOW, trusted_workflow), (MANIFEST, trusted_manifest)):
                      require(api.read_blob(head, path) == expected, 'proposed head changed validator files')
                  pr = api.wait('exact release PR', lambda: load_pr(api, branch, head, base))
                  context['pr'] = pr
                  if branch == 'release/next':
                      context['preparationRun'] = api.wait('preparation conclusion', lambda: preparation(api, pr, base))
                  result = validate_release(context, manifest['original'])
                  require(load_pr(api, branch, head, base) == pr, 'PR metadata moved during validation')
              stable()
              print(json.dumps({'validated': result, 'head': head, 'base': base, 'run': f'https://github.com/{REPOSITORY}/actions/runs/{env["GITHUB_RUN_ID"]}'}))
              return result
          
          
          if __name__ == '__main__':
              try:
                  live()
              except Exception as error:
                  print('Issue 69 native validator failed: ' + (str(error) if isinstance(error, ValueError) else type(error).__name__), file=sys.stderr)
                  sys.exit(1)
          VALIDATOR_PY
